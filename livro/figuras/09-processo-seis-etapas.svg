<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Processo MAPES em seis etapas</title><desc id="desc">Diagrama MAPES: Preparar; Estruturar; Planejar; Organizar e produzir; Implementar; Avaliar e revisar.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#17365D"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#17365D}.label{font:600 20px Arial,sans-serif;fill:#172B4D}</style></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="82" text-anchor="middle" class="title">Processo MAPES em seis etapas</text><rect x="62" y="175" width="156" height="120" rx="14" fill="#F4F7FA" stroke="#17365D" stroke-width="4"/><text x="140.0" y="225" text-anchor="middle" class="label">Preparar</text><path d="M223 235 H241" stroke="#17365D" stroke-width="5" marker-end="url(#arrow)"/><rect x="246" y="175" width="156" height="120" rx="14" fill="#F4F7FA" stroke="#17365D" stroke-width="4"/><text x="324.0" y="225" text-anchor="middle" class="label">Estruturar</text><path d="M407 235 H425" stroke="#17365D" stroke-width="5" marker-end="url(#arrow)"/><rect x="430" y="175" width="156" height="120" rx="14" fill="#F4F7FA" stroke="#17365D" stroke-width="4"/><text x="508.0" y="225" text-anchor="middle" class="label">Planejar</text><path d="M591 235 H609" stroke="#17365D" stroke-width="5" marker-end="url(#arrow)"/><rect x="614" y="175" width="156" height="120" rx="14" fill="#F4F7FA" stroke="#17365D" stroke-width="4"/><text x="692.0" y="225" text-anchor="middle" class="label">Organizar e produzir</text><path d="M775 235 H793" stroke="#17365D" stroke-width="5" marker-end="url(#arrow)"/><rect x="798" y="175" width="156" height="120" rx="14" fill="#F4F7FA" stroke="#17365D" stroke-width="4"/><text x="876.0" y="225" text-anchor="middle" class="label">Implementar</text><path d="M959 235 H977" stroke="#17365D" stroke-width="5" marker-end="url(#arrow)"/><rect x="982" y="175" width="156" height="120" rx="14" fill="#F4F7FA" stroke="#17365D" stroke-width="4"/><text x="1060.0" y="225" text-anchor="middle" class="label">Avaliar e revisar</text><text x="600" y="365" text-anchor="middle" style="font:16px Arial,sans-serif;fill:#425466">Leitura sequencial; a forma e as setas também codificam a relação.</text></svg>